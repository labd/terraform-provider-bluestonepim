name: Govulncheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  # New vulnerabilities are published without any change in this repository
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the Go version from go.mod, so the standard library is checked for
      # the Go version the release is built with. go-version-input has to be
      # empty, otherwise it takes precedence over go-version-file.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ""
          go-version-file: go.mod
          cache: false
